name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36
        run: |
          SM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      - name: Fix permissions
        run: chmod +x ./gradlew

      - name: Build foss debug APK
        run: |
          ./gradlew --no-daemon :app:assembleFossDebug --stacktrace || {
            echo "==== 可用的 assemble 任务 ===="
            ./gradlew --no-daemon :app:tasks --all 2>/dev/null | grep -i assemble | head -40
            exit 1
          }

      - name: List APKs
        if: always()
        run: find . -name "*.apk" | head -30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-foss-debug
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: warn

      - name: Rename for release
        if: success()
        run: |
          f=$(find . -name "*foss*debug*.apk" | head -1)
          [ -z "$f" ] && f=$(find . -name "*.apk" | head -1)
          cp "$f" ./albumsearch-debug.apk
          ls -lh ./albumsearch-debug.apk

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          body: "自动构建的 debug APK"
          files: ./albumsearch-debug.apk
