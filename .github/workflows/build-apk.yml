name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36
        run: |
          SM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      - name: Decode signing keystore
        env:
          KEY_B64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$KEY_B64" | base64 -d > app/release.keystore
          ls -l app/release.keystore
          file app/release.keystore || true

      - name: Fix permissions
        run: chmod +x ./gradlew

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleFossRelease --stacktrace || {
            echo "==== 可用的 assemble 任务 ===="
            ./gradlew --no-daemon :app:tasks --all 2>/dev/null | grep -i assemble | head -40
            exit 1
          }

      - name: Verify APK signature
        run: |
          APK=$(find . -name "*foss*release*.apk" | head -1)
          echo "APK: $APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | head -20

      - name: List APKs
        if: always()
        run: find . -name "*.apk" | head -30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-foss-release
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: warn

      - name: Prepare release file
        if: success()
        run: |
          f=$(find . -name "*foss*release*.apk" | head -1)
          [ -z "$f" ] && f=$(find . -name "*.apk" | head -1)
          cp "$f" ./albumsearch-release.apk
          ls -lh ./albumsearch-release.apk

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          body: "已用 JZH release keystore 签名"
          files: ./albumsearch-release.apk
